{{#extends "base"}}
{{#block "main"}}
<section id="hero" class="hero-section">
  <div class="container hero-container text-center">
    <div class="pill-badge">
      <span class="pill-tag">NEW</span>
      <span class="pill-text">v0.0.4 Unified Release · TMUX IDE · MCP Agent · Worktrees</span>
    </div>
    <h1 class="hero-title">{{headline}}</h1>
    <p class="hero-lead">{{lead}}</p>
    <div class="hero-cta-group">
      <a class="btn btn-primary btn-lg" href="#quickstart">Quick Start</a>
      <a class="btn btn-secondary btn-lg" href="https://github.com/sebastienrousseau/{{name}}" target="_blank" rel="noopener">Star on GitHub</a>
    </div>

    <!-- Authentic Code & Terminal IDE Preview -->
    <figure class="terminal-preview-card">
      <figcaption class="terminal-header">
        <div class="window-dots">
          <span class="dot dot-red" aria-hidden="true"></span>
          <span class="dot dot-yellow" aria-hidden="true"></span>
          <span class="dot dot-green" aria-hidden="true"></span>
        </div>
        <div class="terminal-tab-bar">
          <span class="tab-item active-tab font-mono">Sources/App/Engine.swift</span>
          <span class="tab-item font-mono">terminal</span>
        </div>
        <div class="terminal-actions">
          <span class="badge-status font-mono">● Swift 6.0 Strict Concurrency</span>
        </div>
      </figcaption>
      <div class="terminal-editor-pane">
        <pre class="editor-code font-mono"><code><span class="code-comment">// Sources/App/Engine.swift · Swift 6.0 Strict Concurrency</span>
<span class="code-kw">public actor</span> <span class="code-type">Engine</span>: <span class="code-type">Sendable</span> {
    <span class="code-kw">private var</span> state: <span class="code-type">State</span> = .idle

    <span class="code-kw">public func</span> <span class="code-fn">dispatch</span>&lt;T: <span class="code-type">Sendable</span>&gt;(
        _ task: <span class="code-fn">@Sendable</span> () <span class="code-kw">async throws</span> -&gt; T
    ) <span class="code-kw">async throws</span> -&gt; T {
        <span class="code-kw">self</span>.state = .running
        <span class="code-kw">defer</span> { <span class="code-kw">self</span>.state = .idle }
        <span class="code-kw">return try await</span> <span class="code-fn">task</span>()
    }
}</code></pre>
      </div>
      <div class="terminal-cli-pane font-mono">
        <div class="cli-line"><span class="mcp-tl-ps">$ </span>swift test --enable-code-coverage &amp;&amp; swift-format lint .</div>
        <div class="cli-out">Test Suite 'EnginePackageTests' passed at 2026-08-29 (100% branch coverage)</div>
        <div class="cli-line"><span class="mcp-tl-ask">&gt; </span>Claude MCP: Run SourceKit-LSP code diagnostics on Linux</div>
        <div class="cli-out cli-ok">✓ 100% tests passed · 0 concurrency warnings · SourceKit-LSP connected</div>
      </div>
    </figure>
  </div>
</section>

<!-- Content sections rendered from Markdown -->
<div class="content-sections">
  {{!content}}
</div>

{{/block}}
